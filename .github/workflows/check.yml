name: Check sample
on: [push, pull_request]
permissions:
  contents: read
jobs:
  android-and-shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"'
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - run: python3 scripts/setup.py --platform android
      - run: ./gradlew :composeApp:jvmTest :androidApp:assembleDebug --console=plain
