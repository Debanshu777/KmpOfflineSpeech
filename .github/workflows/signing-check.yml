name: Check signing secrets

on:
  workflow_dispatch:
    inputs:
      expectedFingerprint:
        description: Full 40-character fingerprint of your published signing key
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: siren-signing-check
  cancel-in-progress: false

jobs:
  signing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_SIGNING_FINGERPRINT: ${{ inputs.expectedFingerprint }}
    steps:
      - name: Require main and a valid public fingerprint
        shell: bash
        run: |
          test "$GITHUB_REF" = refs/heads/main || { echo '::error::Run this check from main'; exit 1; }
          [[ "$EXPECTED_SIGNING_FINGERPRINT" =~ ^[0-9A-Fa-f]{40}$ ]] || { echo '::error::A full hexadecimal fingerprint is required'; exit 1; }
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-disabled: true
      - name: Check required secrets and sign a probe with Gradle
        shell: bash
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_KEY_CONTENTS: ${{ secrets.GPG_KEY_CONTENTS }}
          SIGNING_KEY_ID: ${{ secrets.SIGNING_KEY_ID }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          for name in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD GPG_KEY_CONTENTS SIGNING_KEY_ID SIGNING_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done
          ./gradlew -p validation/signing-check signProbe --no-daemon --no-configuration-cache --no-build-cache --console=plain
      - name: Verify the signature using the published public key
        shell: bash
        run: |
          fingerprint="$(printf '%s' "$EXPECTED_SIGNING_FINGERPRINT" | tr '[:lower:]' '[:upper:]')"
          verifier="$RUNNER_TEMP/siren-public-verifier"
          mkdir -m 700 "$verifier"
          curl --fail --silent --show-error --retry 3 --connect-timeout 10 --max-time 60 \
            "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x$fingerprint" \
            --output "$RUNNER_TEMP/siren-public-key.asc"
          gpg --batch --homedir "$verifier" --import "$RUNNER_TEMP/siren-public-key.asc"
          gpg --batch --homedir "$verifier" --status-fd 1 --verify \
            validation/signing-check/build/verification/probe.txt.asc \
            validation/signing-check/build/verification/probe.txt \
            > "$RUNNER_TEMP/siren-signature-status.txt"
          actual="$(awk '$1 == "[GNUPG:]" && $2 == "VALIDSIG" {print $3}' "$RUNNER_TEMP/siren-signature-status.txt")"
          test "$actual" = "$fingerprint" || { echo '::error::Signature fingerprint does not match the requested public key'; exit 1; }
          {
            echo 'Signing secrets verified with Gradle and the published public key.'
            echo
            echo "Fingerprint: $fingerprint"
            echo
            echo 'Both Maven Central credential names are present; their authentication was not tested.'
            echo 'No SDK publication, upload, release or tag task ran.'
          } >> "$GITHUB_STEP_SUMMARY"
